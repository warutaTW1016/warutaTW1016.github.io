    // ================================================================
    //  RENDER CARDS
    // ================================================================
    function renderCards(year) {
      const panel = document.getElementById("panel-" + year);
      const items = (products[year] || []).filter(function(p) {
        return !(p.sold === true || p.sold === "true" || p.sold === 1 || p.sold === "1");
      });
      if (!panel) return;

      panel.innerHTML = "<div class=\"cards-grid\">" + items.map(function (p, i) { return cardHTML(p, i); }).join("") + "</div>";

      panel.querySelectorAll(".card-img").forEach(function (img) {
        img.addEventListener("error", function () {
          this.src = "images/placeholder.png";
          this.classList.add("is-placeholder");
        });
      });
    }

    function cardHTML(p, idx) {
      var isFree = p.price === 0;
      var isUsed = p.notes && (p.notes.indexOf("使用過") !== -1 || p.notes.indexOf("拆封") !== -1);
      var isSold = p.sold === true || p.sold === "true" || p.sold === 1 || p.sold === "1";
      var priceStr = isFree
        ? "<span class=\"price-free\">贈品</span>"
        : "<span class=\"price-value\">NT$" + p.price.toLocaleString() + "</span>";

      var badges = [];
      if (isFree) badges.push("<span class=\"badge badge-free\">贈品</span>");
      if (isUsed) badges.push("<span class=\"badge badge-used\">已使用</span>");

      return "<article class=\"card" + (isSold ? " card-sold" : "") + "\" style=\"animation-delay:" + (idx * 0.04) + "s\">" +
        "<div class=\"card-img-wrap\">" +
        "<img class=\"card-img\" src=\"" + p.img + "\" alt=\"" + p.name + "\" loading=\"lazy\" />" +
        (isSold ? "<div class=\"sold-overlay\"><span class=\"sold-text\">SOLD OUT</span></div>" : "") +
        (badges.length ? "<div class=\"card-badges\">" + badges.join("") + "</div>" : "") +
        "</div>" +
        "<div class=\"card-body\">" +
        "<h2 class=\"card-name\">" + p.name + "</h2>" +
        "<div class=\"card-meta\">" +
        "<div class=\"meta-row\"><span class=\"meta-label\">數量</span><span class=\"meta-val qty-val\">" + p.qty + "</span></div>" +
        "<div class=\"meta-row\"><span class=\"meta-label\">售價</span><span class=\"meta-val\">" + priceStr + "</span></div>" +
        "</div>" +
        (p.notes ? "<p class=\"card-notes\">" + p.notes + "</p>" : "") +
        "</div>" +
        "</article>";
    }

    // ================================================================
    //  TABS
    // ================================================================
    function initTabs() {
      var btns = document.querySelectorAll(".tab-btn");
      var indicator = document.getElementById("tab-indicator");

      function moveIndicator(btn) {
        indicator.style.width = btn.offsetWidth + "px";
        indicator.style.left = btn.offsetLeft + "px";
      }

      function activateTab(year, btn) {
        btns.forEach(function (b) {
          b.classList.remove("active");
          b.setAttribute("aria-selected", "false");
        });
        btn.classList.add("active");
        btn.setAttribute("aria-selected", "true");
        moveIndicator(btn);
        document.querySelectorAll(".year-panel").forEach(function (p) { p.classList.remove("active"); });
        document.getElementById("panel-" + year).classList.add("active");
      }

      btns.forEach(function (btn) {
        btn.addEventListener("click", function () { activateTab(btn.dataset.year, btn); });
      });

      var active = document.querySelector(".tab-btn.active");
      if (active) { requestAnimationFrame(function () { moveIndicator(active); }); }
    }

    // ================================================================
    //  INIT
    // ================================================================
    document.addEventListener("DOMContentLoaded", function () {
      ["2023", "2024", "2025"].forEach(renderCards);
      renderSoldOut();
      initTabs();
    });

    // ================================================================
    //  RENDER SOLD OUT TAB (auto-collect all sold items)
    // ================================================================
    function renderSoldOut() {
      var panel = document.getElementById("panel-sold");
      if (!panel) return;

      var allSold = [];
      ["2023", "2024", "2025"].forEach(function(year) {
        (products[year] || []).forEach(function(p) {
          var isSold = p.sold === true || p.sold === "true" || p.sold === 1 || p.sold === "1";
          if (isSold) allSold.push(p);
        });
      });

      if (allSold.length === 0) {
        panel.innerHTML = "<p class=\"no-sold-msg\">目前尚無已售出商品</p>";
        return;
      }

      panel.innerHTML = "<div class=\"cards-grid\">" + allSold.map(function(p, i) {
        return cardHTML(p, i);
      }).join("") + "</div>";

      panel.querySelectorAll(".card-img").forEach(function(img) {
        img.addEventListener("error", function() {
          this.src = "images/placeholder.png";
          this.classList.add("is-placeholder");
        });
      });
    }
